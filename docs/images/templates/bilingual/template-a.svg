<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="640" viewBox="0 0 2460 640" role="img" aria-labelledby="title desc">
  <title id="title">A · 软萌活力 · 中文与 English</title>
  <desc id="desc">dsh-status-card bilingual template preview</desc>
  <rect width="2460" height="640" rx="32" fill="#eef2f7"/>
  <text x="40" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#52637a">中文 / English</text>
  <svg x="20" y="70" width="1200" height="520" viewBox="0 0 1200 520">
  <title id="zh-title">A · 软萌活力</title>
  <desc id="zh-desc">dsh-status-card 中文模板展示图</desc>
  <defs>
    <linearGradient id="zh-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1f7"/><stop offset="1" stop-color="#f7e8ff"/></linearGradient>
    <linearGradient id="zh-bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="zh-shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6b7280" flood-opacity=".18"/></filter>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI Emoji", sans-serif; fill: #402838; }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: .6px; }
    .title { font-size: 30px; font-weight: 760; }
    .label { font-size: 17px; font-weight: 600; fill: #8b657b; }
    .value { font-size: 24px; font-weight: 720; }
    .badge { font-size: 18px; font-weight: 700; fill: #16875b; }
    .progress { font-size: 17px; font-weight: 650; }
    .footer { font-size: 18px; font-weight: 520; fill: #8b657b; }
  </style>
  <rect width="1200" height="520" rx="28" fill="url(#zh-bg)"/>
  <circle cx="1090" cy="46" r="120" fill="#ec4899" opacity=".08"/>
  <circle cx="110" cy="505" r="150" fill="#a855f7" opacity=".07"/>
  <text x="60" y="60" class="eyebrow">A · 软萌活力</text>
  <rect x="58" y="88" width="1084" height="378" rx="25" fill="#ffffff" stroke="#f1c7dc" stroke-width="2" filter="url(#zh-shadow)"/>
  <text x="92" y="151" class="title">🌸 AI 状态</text>
  <rect x="800" y="119" width="300" height="42" rx="21" fill="#eafaf1"/>
  <text x="950" y="146" class="badge" text-anchor="middle">🌟 超可爱模式</text>
  
    <rect x="92" y="205" width="296" height="90" rx="16" fill="#fff7fb" stroke="#f1c7dc"/>
    <text x="112" y="234" class="label">Mood</text>
    <text x="112" y="272" class="value">😊 开心</text>
    <rect x="422" y="205" width="296" height="90" rx="16" fill="#fff7fb" stroke="#f1c7dc"/>
    <text x="442" y="234" class="label">Status</text>
    <text x="442" y="272" class="value">🐾 陪伴中</text>
    <rect x="752" y="205" width="296" height="90" rx="16" fill="#fff7fb" stroke="#f1c7dc"/>
    <text x="772" y="234" class="label">Energy</text>
    <text x="772" y="272" class="value">⚡ 120%</text>
  <text x="92" y="337" class="progress">可爱度</text>
  <text x="1090" y="337" class="progress" text-anchor="end">100%</text>
  <rect x="92" y="354" width="998" height="14" rx="7" fill="#f1c7dc" opacity=".55"/>
  <rect x="92" y="354" width="998" height="14" rx="7" fill="url(#zh-bar)"/>
  <text x="600" y="417" class="footer" text-anchor="middle">正在给主人准备惊喜喵~</text>
</svg>
