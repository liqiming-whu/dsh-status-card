  <rect width="1200" height="520" rx="28" fill="url(#en-bg)"/>
  <circle cx="1090" cy="46" r="120" fill="#2563eb" opacity=".08"/>
  <circle cx="110" cy="505" r="150" fill="#38bdf8" opacity=".07"/>
  <text x="60" y="60" class="eyebrow">B · Minimal Focus</text>
  <rect x="58" y="88" width="1084" height="378" rx="25" fill="#ffffff" stroke="#d9e1ec" stroke-width="2" filter="url(#en-shadow)"/>
  <text x="92" y="151" class="title">🧭 Focus</text>
  <rect x="800" y="119" width="300" height="42" rx="21" fill="#eefaf3"/>
  <text x="950" y="146" class="badge" text-anchor="middle">✓ Low Distraction</text>

    <rect x="92" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="112" y="234" class="label">Status</text>
    <text x="112" y="272" class="value">🟢 Ready</text>
    <rect x="422" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="442" y="234" class="label">Task</text>
    <text x="442" y="272" class="value">🎯 Processing</text>
    <rect x="752" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="772" y="234" class="label">Energy</text>
