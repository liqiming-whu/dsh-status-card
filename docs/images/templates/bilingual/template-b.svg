  <text x="1090" y="337" class="progress" text-anchor="end">68%</text>
  <rect x="92" y="354" width="998" height="14" rx="7" fill="#d9e1ec" opacity=".55"/>
  <rect x="92" y="354" width="679" height="14" rx="7" fill="url(#en-bar)"/>
  <text x="600" y="417" class="footer" text-anchor="middle">Focusing fully on your request.</text>
