<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">B · Minimal Focus</title>
  <desc id="desc">dsh-status-card English template preview</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6b7280" flood-opacity=".18"/></filter>
  </defs>
  <style>
    text { font-family: Inter, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI Emoji", sans-serif; fill: #172033; }
    .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: .6px; }
    .title { font-size: 30px; font-weight: 760; }
    .label { font-size: 17px; font-weight: 600; fill: #6b778c; }
    .value { font-size: 24px; font-weight: 720; }
    .badge { font-size: 18px; font-weight: 700; fill: #17834f; }
    .progress { font-size: 17px; font-weight: 650; }
    .footer { font-size: 18px; font-weight: 520; fill: #6b778c; }
  </style>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="46" r="120" fill="#2563eb" opacity=".08"/>
  <circle cx="110" cy="505" r="150" fill="#38bdf8" opacity=".07"/>
  <text x="60" y="60" class="eyebrow">B · Minimal Focus</text>
  <rect x="58" y="88" width="1084" height="378" rx="25" fill="#ffffff" stroke="#d9e1ec" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="151" class="title">🧭 Focus</text>
  <rect x="800" y="119" width="300" height="42" rx="21" fill="#eefaf3"/>
  <text x="950" y="146" class="badge" text-anchor="middle">✓ Low Distraction</text>
  
    <rect x="92" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="112" y="234" class="label">Status</text>
    <text x="112" y="272" class="value">🟢 Ready</text>
    <rect x="422" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="442" y="234" class="label">Task</text>
    <text x="442" y="272" class="value">🎯 Processing</text>
    <rect x="752" y="205" width="296" height="90" rx="16" fill="#f8fafc" stroke="#d9e1ec"/>
    <text x="772" y="234" class="label">Energy</text>
    <text x="772" y="272" class="value">⚡ High</text>
  <text x="92" y="337" class="progress">Current task</text>
  <text x="1090" y="337" class="progress" text-anchor="end">68%</text>
  <rect x="92" y="354" width="998" height="14" rx="7" fill="#d9e1ec" opacity=".55"/>
  <rect x="92" y="354" width="679" height="14" rx="7" fill="url(#bar)"/>
  <text x="600" y="417" class="footer" text-anchor="middle">Focusing fully on your request.</text>
</svg>