    .label { font-size: 17px; font-weight: 600; fill: #967064; }
    .value { font-size: 24px; font-weight: 720; }
    .badge { font-size: 18px; font-weight: 700; fill: #4d8b45; }
    .progress { font-size: 17px; font-weight: 650; }
    .footer { font-size: 18px; font-weight: 520; fill: #967064; }
  </style>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="46" r="120" fill="#f59e6b" opacity=".08"/>
  <circle cx="110" cy="505" r="150" fill="#f8c56b" opacity=".07"/>
  <text x="60" y="60" class="eyebrow">E · Warm Companion</text>
  <rect x="58" y="88" width="1084" height="378" rx="25" fill="#fffdf8" stroke="#f3c99f" stroke-width="2" filter="url(#shadow)"/>
  <text x="92" y="151" class="title">☕ Cozy Corner</text>
  <rect x="800" y="119" width="300" height="42" rx="21" fill="#eef9e9"/>
  <text x="950" y="146" class="badge" text-anchor="middle">🍀 Caring Companion</text>
  
    <rect x="92" y="205" width="296" height="90" rx="16" fill="#fff7ed" stroke="#f3c99f"/>
    <text x="112" y="234" class="label">Mood</text>
